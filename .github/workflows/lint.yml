name: Linting Pipeline
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install -g eslint @eslint/js stylelint stylelint-config-standard htmlhint
    - run: npx eslint public
    - run: stylelint public
    - run: htmlhint public
