name: Frontend Linter
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - name: Install Dependencies
      run: npm install eslint @eslint/js stylelint stylelint-config-standard htmlhint

    - name: Run Linters
      run: |
        npx eslint "**/*.js"
        npx stylelint "**/*.css"
        npx htmlhint "**/*.html"