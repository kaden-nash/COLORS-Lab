name: Linting Pipeline
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install -g eslint stylelint stylelint-config-standard htmlhint
    - run: eslint "**/*.js"
    - run: stylelint "**/*.css"
    - run: htmlhint "**/*.html"
